services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: be-chsrc-construct:local
    container_name: be-chsrc-construct
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/app.db
      APP_VERSION: local-docker
      LOG_LEVEL: info
      ENABLE_DEMO_INCIDENTS: "true"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
